<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ioaGoldGradGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE140" />
      <stop offset="30%" stop-color="#F4BF45" />
      <stop offset="60%" stop-color="#DF9C1B" />
      <stop offset="100%" stop-color="#A56E0D" />
    </linearGradient>
    <radialGradient id="globeSphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b5278" />
      <stop offset="55%" stop-color="#18243d" />
      <stop offset="90%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    <filter id="goldGlowGlobe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F4BF45" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Orbit 1 -->
  <ellipse cx="60" cy="60" rx="56" ry="22" transform="rotate(-28 60 60)" 
           stroke="url(#ioaGoldGradGlobe)" stroke-width="2.5" stroke-dasharray="140 10 30 10" opacity="0.85" />
  
  <!-- Base Sphere -->
  <circle cx="60" cy="60" r="44" fill="url(#globeSphereGrad)" stroke="url(#ioaGoldGradGlobe)" stroke-width="2.5" />
  
  <!-- Latitudes -->
  <ellipse cx="60" cy="60" rx="42" ry="14" fill="none" stroke="url(#ioaGoldGradGlobe)" stroke-width="1.2" stroke-opacity="0.65" />
  <ellipse cx="60" cy="44" rx="36" ry="10" fill="none" stroke="url(#ioaGoldGradGlobe)" stroke-width="1" stroke-opacity="0.45" />
  <ellipse cx="60" cy="76" rx="36" ry="10" fill="none" stroke="url(#ioaGoldGradGlobe)" stroke-width="1" stroke-opacity="0.45" />
  
  <!-- Meridians -->
  <ellipse cx="60" cy="60" rx="16" ry="43" fill="none" stroke="url(#ioaGoldGradGlobe)" stroke-width="1.2" stroke-opacity="0.65" />
  <ellipse cx="60" cy="60" rx="32" ry="43" fill="none" stroke="url(#ioaGoldGradGlobe)" stroke-width="1" stroke-opacity="0.45" />
  <line x1="60" y1="16" x2="60" y2="104" stroke="url(#ioaGoldGradGlobe)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Continents in gold -->
  <path d="M 45 32 Q 52 28 58 35 Q 64 42 60 48 Q 54 52 48 46 Z" fill="url(#ioaGoldGradGlobe)" opacity="0.95" />
  <path d="M 52 50 Q 62 55 64 68 Q 63 80 54 86 Q 48 82 50 68 Z" fill="url(#ioaGoldGradGlobe)" opacity="0.95" />
  
  <!-- Front Orbit Ring with Gold Satellites -->
  <ellipse cx="60" cy="60" rx="56" ry="22" transform="rotate(32 60 60)" 
           stroke="url(#ioaGoldGradGlobe)" stroke-width="2.5" opacity="0.95" filter="url(#goldGlowGlobe)" />
  <circle cx="106" cy="40" r="4.5" fill="url(#ioaGoldGradGlobe)" />
  <circle cx="15" cy="78" r="3.5" fill="#FFF3C4" />

  <!-- Highlight -->
  <ellipse cx="44" cy="40" rx="14" ry="8" transform="rotate(-30 44 40)" fill="#ffffff" opacity="0.3" />
</svg>
