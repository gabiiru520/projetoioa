<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" fill="none" class="w-auto h-12">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="ioaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE140" />
      <stop offset="25%" stop-color="#F4BF45" />
      <stop offset="50%" stop-color="#DF9C1B" />
      <stop offset="75%" stop-color="#FAD02C" />
      <stop offset="100%" stop-color="#A56E0D" />
    </linearGradient>
    
    <!-- Deep Sphere Gradient for 3D Earth -->
    <radialGradient id="globeSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b5278" />
      <stop offset="55%" stop-color="#18243d" />
      <stop offset="90%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>

    <!-- Inner Glow -->
    <linearGradient id="globeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BF45" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F4BF45" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#18243d" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#F4BF45" />
      <stop offset="70%" stop-color="#E5A620" />
      <stop offset="100%" stop-color="#FEEAA3" />
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F4BF45" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D GLOBE ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbit Ring 1 -->
    <ellipse cx="60" cy="60" rx="55" ry="22" transform="rotate(-28 60 60)" 
             stroke="url(#ioaGoldGrad)" stroke-width="2.5" stroke-dasharray="140 10 30 10" opacity="0.85" filter="url(#goldShadow)" />
    
    <!-- Base Sphere -->
    <circle cx="60" cy="60" r="44" fill="url(#globeSphere)" stroke="url(#ioaGoldGrad)" stroke-width="2" />
    
    <!-- Latitudes and Longitudes (Gold Grids) -->
    <!-- Equator and parallels -->
    <ellipse cx="60" cy="60" rx="42" ry="14" fill="none" stroke="url(#ioaGoldGrad)" stroke-width="1.2" stroke-opacity="0.65" />
    <ellipse cx="60" cy="44" rx="36" ry="10" fill="none" stroke="url(#ioaGoldGrad)" stroke-width="1" stroke-opacity="0.45" />
    <ellipse cx="60" cy="76" rx="36" ry="10" fill="none" stroke="url(#ioaGoldGrad)" stroke-width="1" stroke-opacity="0.45" />
    
    <!-- Meridians -->
    <ellipse cx="60" cy="60" rx="16" ry="43" fill="none" stroke="url(#ioaGoldGrad)" stroke-width="1.2" stroke-opacity="0.65" />
    <ellipse cx="60" cy="60" rx="32" ry="43" fill="none" stroke="url(#ioaGoldGrad)" stroke-width="1" stroke-opacity="0.45" />
    <line x1="60" y1="16" x2="60" y2="104" stroke="url(#ioaGoldGrad)" stroke-width="1.5" stroke-opacity="0.75" />

    <!-- Stylized Americas Continents (Gold Filigree Silhouette) -->
    <path d="M 45 32 Q 52 28 58 35 Q 64 42 60 48 Q 54 52 48 46 Z" fill="url(#ioaGoldGrad)" opacity="0.9" />
    <path d="M 52 50 Q 62 55 64 68 Q 63 80 54 86 Q 48 82 50 68 Z" fill="url(#ioaGoldGrad)" opacity="0.95" />
    
    <!-- Front Orbit Ring with Gold Satellites / Nodes -->
    <ellipse cx="60" cy="60" rx="55" ry="22" transform="rotate(32 60 60)" 
             stroke="url(#ioaGoldGrad)" stroke-width="2.5" opacity="0.95" />
    <circle cx="106" cy="40" r="4.5" fill="url(#ioaGoldGrad)" filter="url(#goldShadow)" />
    <circle cx="15" cy="78" r="3" fill="#FFF3C4" />

    <!-- 3D Light Specular Highlight -->
    <ellipse cx="44" cy="40" rx="14" ry="8" transform="rotate(-30 44 40)" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <!-- Main Acronym "IOA" -->
  <text x="148" y="74" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="54" letter-spacing="4" fill="url(#goldTextGrad)" filter="url(#goldShadow)">
    IOA
  </text>
  
  <!-- Suffix "NATAL" -->
  <text x="282" y="74" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="8" fill="#FFFFFF">
    NATAL
  </text>

  <!-- Golden Divider Bar -->
  <rect x="150" y="86" width="450" height="2" fill="url(#ioaGoldGrad)" rx="1" />

  <!-- Subtitle / Tagline -->
  <text x="151" y="105" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12.5" letter-spacing="3.5" fill="#D2DAE8">
    INTERNATIONAL DENTAL ACADEMY
  </text>
  <text x="442" y="105" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="11.5" letter-spacing="2" fill="url(#goldTextGrad)">
    • REDE DAS AMÉRICAS
  </text>
</svg>
